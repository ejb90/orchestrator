[project]
name = "orchestrator"
version = "0.1.0"
description = "Durable Python-first workflow orchestration for local execution"
readme = "README.md"
authors = [
    { name = "Ellis Broatch", email = "ellis.broatch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "rich>=13,<15",
    "pyyaml>=6.0.3,<7",
    "rich-click>=1.9,<2",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["src/orchestrator"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
