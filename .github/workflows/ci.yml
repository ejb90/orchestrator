name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install supported shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh fish
          command -v bash
          command -v zsh
          command -v fish
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check src tests examples scripts
      - name: Check formatting
        run: uv run --locked ruff format --check src tests examples scripts
      - name: Type check
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest
      - name: Build documentation
        run: uv run --locked mkdocs build --strict
