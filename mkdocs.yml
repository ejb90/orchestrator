site_name: Orchestrator
site_description: Python-first local workflow orchestration
docs_dir: docs
site_dir: site
theme:
  name: material
  font: false
  icon:
    logo: material/graph-outline
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: google
            members_order: source
            filters: []
            inherited_members: false
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_source: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started/quickstart.md
      - Practical workflows: getting-started/practical-workflows.md
  - Fundamentals:
      - Overview: fundamentals/index.md
      - Philosophy: fundamentals/philosophy.md
      - Definitions and compilation: fundamentals/definitions.md
      - Graphs and control flow: fundamentals/graphs.md
      - Data and execution contracts: fundamentals/contracts.md
      - Durable execution and recovery: fundamentals/durability.md
  - User guide:
      - Workflow combinations: guide/workflows.md
      - YAML definitions: guide/yaml.md
      - Workflow DAGs: guide/dags.md
      - Script tasks and Slurm: guide/scripts.md
      - Tasks and artifacts: guide/tasks.md
      - Operations and recovery: guide/operations.md
      - Execution directories: guide/directories.md
  - Reference:
      - API reference:
          - Overview: reference/api/index.md
          - Workflow builders: reference/api/api.md
          - Specification and compiler: reference/api/spec.md
          - YAML loader: reference/api/yaml_loader.md
          - Coordinator: reference/api/engine.md
          - Execution backends: reference/api/backends.md
          - Script rendering: reference/api/scripts.md
          - Artifact lifecycle: reference/api/artifacts.md
          - Worker runner: reference/api/runner.md
          - Persistence: reference/api/storage.md
          - Execution paths: reference/api/paths.md
          - Terminal views: reference/api/presentation.md
          - CLI: reference/api/cli.md
      - Architecture and status: reference/architecture.md
      - Development and CI: reference/development.md
