<svg xmlns="http://www.w3.org/2000/svg" width="380" height="370" viewBox="0 0 380 370" role="img" aria-labelledby="title desc">
<title id="title">Command workflow</title>
<desc id="desc">Workflow dependency graph. Task nodes are blue, decisions yellow, scope boundaries grey, and finalizers green.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="380" height="370" fill="white"/>
<text x="190.0" y="25" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0f172a">Command workflow</text>
<path d="M 190.0 214 L 190.0 247" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 190.0 114 L 190.0 147" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="50" width="320" height="64" rx="8" fill="#e2e8f0" stroke="#64748b"/>
<text x="190.0" y="76" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">command/@enter</text>
<text x="190.0" y="97" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">enter</text>
<rect x="30.0" y="250" width="320" height="64" rx="8" fill="#e2e8f0" stroke="#64748b"/>
<text x="190.0" y="276" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">command/@exit</text>
<text x="190.0" y="297" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">exit</text>
<rect x="30.0" y="150" width="320" height="64" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="190.0" y="176" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">command/write</text>
<text x="190.0" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">task</text>
</svg>
